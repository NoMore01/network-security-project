!
version 15.1
service timestamps log datetime msec
no service timestamps debug datetime msec
service password-encryption
security passwords min-length 10
!
hostname BRANCH_INT2
!
login block-for 60 attempts 2 within 30
login on-failure log
login on-success log
!
enable secret <removed>
!
aaa new-model
!
aaa authentication login default local enable 
!
no ip cef
no ipv6 cef
!
username Admin01 secret <removed>
!
license udi pid CISCO2911/K9 sn <removed>
license boot module c2900 technology-package securityk9
!
ip ssh version 2
ip ssh authentication-retries 2
ip ssh time-out 90
ip domain-name ccnasecurity.com
!
spanning-tree mode pvst
!
interface GigabitEthernet0/0
 ip address 172.18.88.134 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <removed>
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/1.99
 encapsulation dot1Q 99
 ip address 172.18.88.65 255.255.255.192
 ip helper-address 172.18.88.133
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <removed>
!
interface GigabitEthernet0/1.300
 encapsulation dot1Q 300
 ip address 172.18.86.1 255.255.255.0
 ip helper-address 172.18.88.133
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <removed>
!
interface GigabitEthernet0/1.400
 encapsulation dot1Q 400
 ip address 172.18.88.1 255.255.255.192
 ip helper-address 172.18.88.133
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <removed>
!
interface GigabitEthernet0/2
 ip address 172.18.88.138 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <removed>
 duplex auto
 speed auto
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 router-id 3.3.3.3
 log-adjacency-changes
 passive-interface GigabitEthernet0/1
 network 172.18.88.132 0.0.0.3 area 0
 network 172.18.88.136 0.0.0.3 area 0
 network 172.18.86.0 0.0.0.255 area 0
 network 172.18.88.0 0.0.0.63 area 0
 network 172.18.88.64 0.0.0.63 area 0
!
ip classless
ip route 172.18.84.0 255.255.254.0 GigabitEthernet0/2 
ip route 172.18.87.0 255.255.255.128 172.18.88.137 
ip route 172.18.84.0 255.255.254.0 172.18.88.137 
!
ip flow-export version 9
!
ip access-list extended sl_def_acl
 deny tcp any any eq telnet
 deny tcp any any eq www
 deny tcp any any eq 22
 permit tcp any any eq 22
!
banner motd # Unauthorized access strictly prohibited! #
!
logging 172.18.86.4
line con 0
 exec-timeout 15 0
 logging synchronous
 login authentication default
 privilege level 15
!
line aux 0
!
line vty 0 4
 exec-timeout 15 0
 logging synchronous
 login authentication default
 transport input ssh
 privilege level 15
line vty 5 15
 exec-timeout 15 0
 logging synchronous
 login authentication default
 transport input ssh
 privilege level 15
!
end
