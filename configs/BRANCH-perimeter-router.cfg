!
version 15.1
service timestamps log datetime msec
no service timestamps debug datetime msec
service password-encryption
security passwords min-length 10
!
hostname BRANCH
!
login block-for 60 attempts 2 within 30
login on-failure log
login on-success log
!
enable secret <removed>
!
ip dhcp excluded-address 172.18.84.1 172.18.84.10
ip dhcp excluded-address 172.18.87.1 172.18.87.10
ip dhcp excluded-address 172.18.87.129 172.18.87.138
ip dhcp excluded-address 172.18.86.1 172.18.86.10
ip dhcp excluded-address 172.18.88.1 172.18.88.10
ip dhcp excluded-address 172.18.88.64 172.18.88.73
!
ip dhcp pool VLAN100_POOL
 network 172.18.84.0 255.255.254.0
 default-router 172.18.84.1
 dns-server 165.16.151.10
ip dhcp pool VLAN200_POOL
 network 172.18.87.0 255.255.255.128
 default-router 172.18.87.1
 dns-server 165.16.151.10
ip dhcp pool VLAN300_POOL
 network 172.18.86.0 255.255.255.0
 default-router 172.18.86.1
 dns-server 165.16.151.10
ip dhcp pool VLAN400_POOL
 network 172.18.88.0 255.255.255.192
 default-router 172.18.88.1
 dns-server 165.16.151.10
ip dhcp pool VLAN99_B1_POOL
 network 172.18.87.128 255.255.255.192
 default-router 172.18.87.129
 dns-server 165.16.151.10
ip dhcp pool VLAN99_B2_POOL
 network 172.18.88.64 255.255.255.192
 default-router 172.18.88.65
 dns-server 165.16.151.10
!
aaa new-model
!
aaa authentication login default local enable 
!
no ip cef
no ipv6 cef
!
username Admin01 secret <removed>
!
license udi pid CISCO2901/K9 sn <removed>
license boot module c2900 technology-package securityk9
!
ip ssh version 2
ip ssh authentication-retries 2
ip ssh time-out 90
ip domain-name ccnasecurity.com
!
spanning-tree mode pvst
!
class-map type inspect match-any ALLOWED-PROTOCOLS
 match protocol tcp
 match protocol udp
 match protocol icmp
!
policy-map type inspect INSIDE-TO-OUTSIDE
 class type inspect ALLOWED-PROTOCOLS
  inspect
!
zone security INSIDE
zone security OUTSIDE
zone-pair security INSIDE-TO-OUTSIDE source INSIDE destination OUTSIDE
 service-policy type inspect INSIDE-TO-OUTSIDE
!
interface GigabitEthernet0/0
 ip address 172.18.88.129 255.255.255.252
 zone-member security INSIDE
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <removed>
 ip nat inside
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 ip address 172.18.88.133 255.255.255.252
 zone-member security INSIDE
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <removed>
 ip nat inside
 duplex auto
 speed auto
!
interface Serial0/0/0
 bandwidth 2048
 no ip address
 clock rate 2000000
 shutdown
!
interface Serial0/0/1
 ip address 165.16.151.133 255.255.255.252
 zone-member security OUTSIDE
 ip nat outside
 clock rate 2000000
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 network 172.18.88.128 0.0.0.3 area 0
 network 172.18.88.132 0.0.0.3 area 0
 default-information originate
!
ip nat inside source list 1 interface Serial0/0/1 overload
ip classless
ip route 0.0.0.0 0.0.0.0 Serial0/0/1 
!
ip flow-export version 9
!
ip access-list extended sl_def_acl
 deny tcp any any eq telnet
 deny tcp any any eq www
 deny tcp any any eq 22
 permit tcp any any eq 22
access-list 1 permit 172.18.87.128 0.0.0.63
access-list 1 permit 172.18.84.0 0.0.1.255
access-list 1 permit 172.18.87.0 0.0.0.127
access-list 1 permit 172.18.86.0 0.0.0.255
access-list 1 permit 172.18.88.0 0.0.0.63
access-list 1 permit 172.18.88.64 0.0.0.63
!
banner motd # Unauthorized access strictly prohibited! #
!
logging 172.18.86.4
line con 0
 exec-timeout 15 0
 logging synchronous
 login authentication default
 privilege level 15
!
line aux 0
!
line vty 0 4
 exec-timeout 15 0
 logging synchronous
 login authentication default
 transport input ssh
 privilege level 15
line vty 5 15
 exec-timeout 15 0
 logging synchronous
 login authentication default
 transport input ssh
 privilege level 15
!
ntp authentication-key 1 md5 <removed>
ntp authenticate
ntp trusted-key 1
ntp server 165.16.151.10 key 1
ntp update-calendar
!
end
