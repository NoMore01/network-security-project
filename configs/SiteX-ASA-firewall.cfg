ASA Version 9.6(1)
!
hostname SiteX-FW
domain-name NWS.com
enable password <removed>
names
!
interface GigabitEthernet1/1
 nameif OUTSIDE
 security-level 1
 ip address 209.165.151.234 255.255.255.252
!
interface GigabitEthernet1/2
 nameif INSIDE
 security-level 100
 ip address 172.18.89.2 255.255.255.192
!
interface GigabitEthernet1/3
 no nameif
 no security-level
 no ip address
 shutdown
!
interface GigabitEthernet1/4
 no nameif
 no security-level
 no ip address
 shutdown
!
interface GigabitEthernet1/5
 no nameif
 no security-level
 no ip address
 shutdown
!
interface GigabitEthernet1/6
 no nameif
 no security-level
 no ip address
 shutdown
!
interface GigabitEthernet1/7
 no nameif
 no security-level
 no ip address
 shutdown
!
interface GigabitEthernet1/8
 no nameif
 no security-level
 ip address 172.18.90.1 255.255.255.192
 shutdown
!
interface Management1/1
 management-only
 no nameif
 no security-level
 no ip address
 shutdown
!
object network INSIDE-nat
 subnet 172.18.89.0 255.255.255.192
 nat (INSIDE,OUTSIDE) dynamic interface
 description All hosts in Site-X to be dynamically translated
!
route OUTSIDE 0.0.0.0 0.0.0.0 209.165.151.233 1
!
access-list OUT-IN extended permit ip host 165.16.151.10 host 209.165.151.234
access-list OUT-IN extended permit ip any 172.18.89.0 255.255.255.192
access-list SiteX extended permit tcp 172.18.89.0 255.255.255.192 any eq www
access-list SiteX extended permit tcp 172.18.89.0 255.255.255.192 any eq 443
access-list SiteX extended permit tcp 172.18.89.0 255.255.255.192 any eq ftp
access-list SiteX extended permit tcp 172.18.89.0 255.255.255.192 any eq domain
access-list SiteX extended permit icmp any any
access-list SiteX extended permit udp any any eq bootps
access-list SiteX extended permit udp any any eq bootpc
!
access-group OUT-IN in interface OUTSIDE
access-group SiteX out interface INSIDE
aaa authentication ssh console LOCAL
!
ntp authentication-key 1 md5 <removed>
ntp authenticate
ntp trusted-key 1
ntp server 172.18.89.9 key 1
username Admin01 password <removed>
!
class-map inspection_default
 match default-inspection-traffic
!
policy-map type inspect dns preset_dns_map
 parameters
  message-length maximum 512
policy-map global_policy
 class inspection_default
  inspect dns preset_dns_map
  inspect ftp 
  inspect tftp 
!
service-policy global_policy global
!
telnet timeout 5
ssh 172.18.89.10 255.255.255.255 INSIDE
ssh timeout 20
!
dhcpd address 172.18.89.11-172.18.89.62 INSIDE
dhcpd dns 165.16.151.10 interface INSIDE
dhcpd enable INSIDE
!
