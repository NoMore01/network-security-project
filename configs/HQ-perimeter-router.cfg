!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
service password-encryption
security passwords min-length 10
!
hostname HQ
!
login block-for 60 attempts 2 within 30
login on-failure log
login on-success log
!
enable secret <removed>
!
aaa new-model
!
aaa authentication login default local enable 
!
no ip cef
no ipv6 cef
!
username Admin01 secret <removed>
!
license udi pid CISCO2901/K9 sn <removed>
license boot module c2900 technology-package securityk9
!
crypto isakmp policy 10
 encr aes 256
 authentication pre-share
 group 5
!
crypto isakmp key <removed> address 165.16.113.129
crypto isakmp key <removed> address 165.16.122.129
crypto isakmp key <removed> address 165.16.152.129
crypto isakmp key <removed> address 165.16.153.129
crypto isakmp key <removed> address 165.16.154.129
!
crypto ipsec transform-set VPN-SET esp-aes 256 esp-sha-hmac
!
crypto map VPN-MAP 10 ipsec-isakmp 
 description VPN TO SINGAPORE
 set peer 165.16.154.129
 set pfs group5
 set security-association lifetime seconds 86400
 set transform-set VPN-SET 
 match address HQ-INT
!
crypto map VPN-MAP 20 ipsec-isakmp 
 description VPN TO US
 set peer 165.16.153.129
 set pfs group5
 set security-association lifetime seconds 86400
 set transform-set VPN-SET 
 match address HQ-INT
!
crypto map VPN-MAP 30 ipsec-isakmp 
 description VPN TO CHINA
 set peer 165.16.113.129
 set peer 165.16.152.129
 set pfs group5
 set security-association lifetime seconds 86400
 set transform-set VPN-SET 
 match address HQ-INT
!
ip ssh version 2
ip ssh authentication-retries 2
ip ssh time-out 90
ip domain-name ccnasecurity.com
!
spanning-tree mode pvst
!
interface GigabitEthernet0/0
 ip address 209.165.151.225 255.255.255.248
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface Serial0/0/0
 bandwidth 1000000
 ip address 165.16.151.129 255.255.255.252
 clock rate 2000000
 crypto map VPN-MAP
!
interface Serial0/0/1
 no ip address
 clock rate 2000000
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 log-adjacency-changes
!
router ospf 101
 router-id 30.1.1.1
 log-adjacency-changes
 network 165.16.151.128 0.0.0.3 area 0
 network 209.165.151.224 0.0.0.7 area 0
!
ip classless
ip route 172.18.80.0 255.255.252.0 GigabitEthernet0/1 
ip route 172.18.87.192 255.255.255.192 209.165.151.226 
ip route 0.0.0.0 0.0.0.0 165.16.151.130 
!
ip flow-export version 9
!
ip access-list extended sl_def_acl
 deny tcp any any eq telnet
 deny tcp any any eq www
 deny tcp any any eq 22
 permit tcp any any eq 22
ip access-list extended HQ-INT
 permit ip 172.18.80.0 0.0.3.255 10.126.120.0 0.0.3.255
 permit ip 172.18.80.0 0.0.3.255 172.22.152.0 0.0.3.255
 permit ip 172.18.80.0 0.0.3.255 192.168.96.0 0.0.3.255
 permit ip 172.18.80.0 0.0.3.255 10.168.196.0 0.0.3.255
 permit ip 172.18.80.0 0.0.3.255 172.20.96.0 0.0.1.255
!
banner motd # Unauthorized access strictly prohibited! #
!
line con 0
 exec-timeout 15 0
 logging synchronous
 login authentication default
 privilege level 15
!
line aux 0
!
line vty 0 4
 exec-timeout 15 0
 logging synchronous
 login authentication default
 transport input ssh
 privilege level 15
line vty 5 15
 exec-timeout 15 0
 logging synchronous
 login authentication default
 transport input ssh
 privilege level 15
!
ntp authentication-key 1 md5 <removed>
ntp authenticate
ntp trusted-key 1
ntp server 165.16.151.10 key 1
ntp update-calendar
!
end
