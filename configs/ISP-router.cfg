!
version 12.2
no service timestamps log datetime msec
no service timestamps debug datetime msec
service password-encryption
!
hostname ISP
!
no ip cef
no ipv6 cef
!
interface FastEthernet0/0
 ip address 165.16.151.1 255.255.255.128
 duplex auto
 speed auto
!
interface Serial0/0
 ip address 165.16.151.130 255.255.255.252
!
interface Serial0/1
 ip address 165.16.151.134 255.255.255.252
!
interface Serial0/2
 ip address 165.16.151.137 255.255.255.252
!
interface Serial0/3
 bandwidth 2048
 ip address 159.240.0.10 255.255.255.252
 clock rate 2000000
!
router ospf 101
 router-id 10.1.1.1
 log-adjacency-changes
 network 165.16.151.128 0.0.0.3 area 0
 network 159.240.0.8 0.0.0.3 area 0
 network 165.16.151.0 0.0.0.127 area 0
!
router rip
!
ip classless
ip route 209.165.151.224 255.255.255.248 165.16.151.129 
ip route 209.165.151.232 255.255.255.252 165.16.151.138 
!
ip flow-export version 9
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
end
