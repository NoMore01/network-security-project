!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
service password-encryption
security passwords min-length 10
!
hostname HQ_FW
!
login block-for 60 attempts 2 within 30
login on-failure log
login on-success log
!
enable secret <removed>
!
ip dhcp excluded-address 172.18.80.1 172.18.80.10
!
ip dhcp pool HQ_POOL
 network 172.18.80.0 255.255.252.0
 default-router 172.18.80.1
 dns-server 172.18.87.194
!
aaa new-model
!
aaa authentication login default local enable 
!
no ip cef
no ipv6 cef
!
username Admin01 secret <removed>
!
license udi pid CISCO2911/K9 sn <removed>
license boot module c2900 technology-package securityk9
!
ip ssh version 2
ip ssh authentication-retries 2
ip ssh time-out 90
ip domain-name ccnasecurity.com
!
spanning-tree mode pvst
!
class-map type inspect match-any ALLOWED-PROTOCOLS
 match protocol tcp
 match protocol udp
 match protocol icmp
class-map type inspect match-any OUTSIDE-TO-INSIDE
 match protocol icmp
!
policy-map type inspect INSIDE-TO-OUTSIDE
 class type inspect ALLOWED-PROTOCOLS
  inspect
!
policy-map type inspect INSIDE-TO-DMZ
 class type inspect ALLOWED-PROTOCOLS
  inspect
!
policy-map type inspect OUTSIDE-TO-DMZ
 class type inspect ALLOWED-PROTOCOLS
  inspect
!
policy-map type inspect OUTSIDE-TO-INSIDE-POLICY
 class type inspect OUTSIDE-TO-INSIDE
  inspect
!
zone security INSIDE
zone security OUTSIDE
zone security DMZ
zone-pair security INSIDE-TO-OUTSIDE source INSIDE destination OUTSIDE
 service-policy type inspect INSIDE-TO-OUTSIDE
zone-pair security INSIDE-TO-DMZ source INSIDE destination DMZ
 service-policy type inspect INSIDE-TO-DMZ
zone-pair security OUTSIDE-TO-DMZ source OUTSIDE destination DMZ
 service-policy type inspect OUTSIDE-TO-DMZ
zone-pair security OUTSIDE-TO-INSIDE source OUTSIDE destination INSIDE
 service-policy type inspect OUTSIDE-TO-INSIDE-POLICY
!
interface GigabitEthernet0/0
 ip address 209.165.151.226 255.255.255.248
 zone-member security OUTSIDE
 ip nat outside
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 ip address 172.18.80.1 255.255.252.0
 zone-member security INSIDE
 ip nat inside
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 ip address 172.18.87.193 255.255.255.192
 zone-member security DMZ
 ip nat inside
 duplex auto
 speed auto
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 101
 router-id 30.2.2.2
 log-adjacency-changes
 network 172.18.80.0 0.0.3.255 area 0
 network 209.165.151.224 0.0.0.7 area 0
!
ip nat pool HQ_NAT_POOL 209.165.151.228 209.165.151.230 netmask 255.255.255.248
ip nat inside source list NAT-ACL pool HQ_NAT_POOL
ip nat inside source static 172.18.87.194 209.165.151.227 
ip classless
ip route 0.0.0.0 0.0.0.0 GigabitEthernet0/0 
!
ip flow-export version 9
!
ip access-list extended sl_def_acl
 deny tcp any any eq telnet
 deny tcp any any eq www
 deny tcp any any eq 22
 permit tcp any any eq 22
access-list 1 permit 172.18.80.0 0.0.3.255
ip access-list extended NAT-ACL
 deny ip 172.18.80.0 0.0.3.255 10.126.160.0 0.0.3.255
 deny ip 172.18.80.0 0.0.3.255 192.168.96.0 0.0.3.255
 deny ip 172.18.80.0 0.0.3.255 172.22.152.0 0.0.3.255
 deny ip 172.18.80.0 0.0.3.255 10.168.196.0 0.0.3.255
 deny ip 172.18.80.0 0.0.3.255 172.20.96.0 0.0.1.255
 permit ip 172.18.80.0 0.0.3.255 any
!
banner motd # Unauthorized access strictly prohibited! #
!
line con 0
 exec-timeout 15 0
 logging synchronous
 login authentication default
 privilege level 15
!
line aux 0
!
line vty 0 4
 exec-timeout 15 0
 logging synchronous
 login authentication default
 transport input ssh
 privilege level 15
line vty 5 15
 exec-timeout 15 0
 logging synchronous
 login authentication default
 transport input ssh
 privilege level 15
!
end
