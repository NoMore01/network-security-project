!
version 15.1
service timestamps log datetime msec
no service timestamps debug datetime msec
service password-encryption
security passwords min-length 10
!
hostname BRANCH_INT1
!
login block-for 60 attempts 2 within 30
login on-failure log
login on-success log
!
enable secret <removed>
!
aaa new-model
!
aaa authentication login default local enable 
!
no ip cef
no ipv6 cef
!
username Admin01 secret <removed>
!
license udi pid CISCO2911/K9 sn <removed>
license boot module c2900 technology-package securityk9
!
ip ssh version 2
ip ssh authentication-retries 2
ip ssh time-out 90
ip domain-name ccnasecurity.com
!
spanning-tree mode pvst
!
interface GigabitEthernet0/0
 ip address 172.18.88.130 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <removed>
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 ip address 172.18.88.141 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <removed>
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 ip address 172.18.88.137 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <removed>
 duplex auto
 speed auto
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes
 network 172.18.88.128 0.0.0.3 area 0
 network 172.18.88.136 0.0.0.3 area 0
 network 172.18.88.140 0.0.0.3 area 0
 network 172.18.87.128 0.0.0.63 area 0
 network 172.18.84.0 0.0.1.255 area 0
 network 172.18.87.0 0.0.0.127 area 0
!
ip classless
ip route 172.18.84.0 255.255.254.0 172.18.88.142 
ip route 172.18.87.0 255.255.255.128 172.18.88.142 
!
ip flow-export version 9
!
ip access-list extended sl_def_acl
 deny tcp any any eq telnet
 deny tcp any any eq www
 deny tcp any any eq 22
 permit tcp any any eq 22
!
banner motd # Unauthorized access strictly prohibited! #
!
logging 172.18.86.4
line con 0
 exec-timeout 15 0
 logging synchronous
 login authentication default
 privilege level 15
!
line aux 0
!
line vty 0 4
 exec-timeout 15 0
 logging synchronous
 login authentication default
 transport input ssh
 privilege level 15
line vty 5 15
 exec-timeout 15 0
 logging synchronous
 login authentication default
 transport input ssh
 privilege level 15
!
end
